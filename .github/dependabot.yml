version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # pnpm-workspace.yaml holds TypeScript at ^6 with an override; remove this to upgrade.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 21
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
      npm-dev-major:
        dependency-type: development
        update-types:
          - major
      npm-production-major:
        dependency-type: production
        update-types:
          - major
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 21
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
